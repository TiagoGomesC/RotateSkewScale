<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
 <main class="container">
        <!-- Bloco 1 -->
        <div class="card-box">
            <div class="card card-1">
                <h2>StudioWear</h2>
                <p>Empresa de moda e estilo</p>
            </div>
            <p class="efeito">scale(1.1) translateY(-10px)</p>
        </div>

        <!-- Bloco 2 -->
        <div class="card-box">
            <div class="card card-2">
                <h2>Noel's Presents</h2>
                <p>Loja de presentes e listas de natal</p>
            </div>
            <p class="efeito">skew(10deg) scale(1.05)</p>
        </div>

        <!-- Bloco 3 -->
        <div class="card-box">
            <div class="card card-3">
                <h2>MesaTeca</h2>
                <p>Biblioteca local</p>
            </div>
            <p class="efeito">rotate(5deg) translate(10px, -5px)</p>
        </div>
        
        
    </main>

    <footer>
        <p>© 2026 M4 Corp. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
